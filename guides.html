<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå – Guides</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1722">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="icon-180.png">
  <link id="favicon-icon" rel="icon" href="favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles/common.css">

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at top, var(--bg-top), transparent 35%),
        linear-gradient(180deg, var(--bg-grad-top) 0%, var(--bg-grad-bottom) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100%;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body {
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 14px 28px;
    }

    .header {
      margin-bottom: 18px;
    }

    .logo-wrap {
      background: var(--logo-wrap-bg);
      border: 1px solid var(--logo-wrap-border);
      border-radius: 24px;
      padding: 10px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }

    .page-title {
      margin: 18px 4px 6px;
      font-size: 1.75rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .page-subtitle {
      margin: 0 10px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.35;
    }

    .guide-list {
      display: grid;
      gap: 14px;
    }

    .guide-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.12s ease;
    }

    .guide-card:hover {
      border-color: var(--card-hover-border);
      box-shadow: var(--card-hover-shadow);
      transform: translateY(-1px);
    }

    .guide-card:active {
      transform: scale(0.995);
    }

    .guide-title {
      margin: 0 0 8px;
      font-size: 1.2rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .guide-desc {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .empty-note {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }

    .back-row {
      margin-top: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      background: var(--back-bg);
      color: var(--accent);
      border: 1px solid var(--back-border);
      box-shadow: var(--shadow);
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    @media (min-width: 700px) {
      .guide-list {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo-wrap">
        <a href="index.html" aria-label="Go to home page"><img id="main-logo" src="logo_winter_daytime.webp" alt="Himmelblå logo" class="logo"></a>
      </div>
      <h1 class="page-title">Guides</h1>
      <p class="page-subtitle">
        Step-by-step guides for anything and everything at Himmelblå.
      </p>
    </header>

    <section id="guide-list" class="guide-list"></section>

    <div class="back-row">
      <a class="back-link" href="index.html">Back</a>
    </div>
  </main>

  <script src="scripts/site-data.js"></script>
  <script>
    const guides = window.SITE_DATA.guides
      .filter(g => g.listed)
      .map(g => ({
        title: g.title,
        description: g.summary,
        href: `guide.html?id=${g.id}`
      }));

    const guideListEl = document.getElementById("guide-list");

    function renderGuides() {
      guideListEl.innerHTML = "";

      const sortedGuides = [...guides].sort((a, b) =>
        a.title.localeCompare(b.title, undefined, { sensitivity: "base" })
      );

      if (!sortedGuides.length) {
        guideListEl.innerHTML = '<div class="empty-note">No guides added yet.</div>';
        return;
      }

      sortedGuides.forEach(guide => {
        if (!guide.href) return;

        const card = document.createElement("a");
        card.className = "guide-card";
        card.href = guide.href;

        const title = document.createElement("h2");
        title.className = "guide-title";
        title.textContent = guide.title;
        card.appendChild(title);

        const desc = document.createElement("p");
        desc.className = "guide-desc";
        desc.textContent = guide.description || "";
        card.appendChild(desc);

        guideListEl.appendChild(card);
      });

      if (!guideListEl.children.length) {
        guideListEl.innerHTML = '<div class="empty-note">No guides added yet.</div>';
      }
    }

    renderGuides();
  </script>
  <script src="scripts/theme.js"></script>
  <script src="scripts/search-target.js"></script>
  <script>
    initializeTheme();
  </script>
</body>
</html>
