<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1722">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="logo.png">
  <link id="favicon-icon" rel="icon" href="logo.png">

  <style>
    :root {
      --bg: #f5f7fa;
      --bg-top-glow: rgba(38, 84, 124, 0.08);
      --bg-grad-top: #f9fafc;
      --bg-grad-bottom: #f3f5f8;

      --shell-top: rgba(255,255,255,0.94);
      --shell-bottom: rgba(255,255,255,0.94);
      --shell-border: rgba(16,35,63,0.08);
      --shell-shadow: 0 8px 24px rgba(16,38,62,0.08);

      --hero-top: rgba(255,255,255,0.72);
      --hero-bottom: rgba(255,255,255,0.72);

      --card: rgba(255,255,255,0.98);
      --card-strong: rgba(255,255,255,0.98);
      --text: #10233f;
      --muted: #64758b;
      --border: rgba(16,35,63,0.10);
      --shadow: 0 4px 14px rgba(16,35,63,0.08);
      --accent: #1f4f7d;
      --accent-2: #1f4f7d;

      --logo-bg: #ffffff;
      --logo-shadow: 0 4px 14px rgba(16,35,63,0.08);

      --tool-border: rgba(16,35,63,0.10);
      --tool-active-top: rgba(248,250,252,1);
      --tool-active-bottom: rgba(248,250,252,1);
      --tool-active-shadow: 0 3px 10px rgba(16,35,63,0.08);

      --radius-lg: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html[data-theme="dark"] {
      --bg: #0f1722;
      --bg-top-glow: rgba(94, 126, 158, 0.18);
      --bg-grad-top: #0f1722;
      --bg-grad-bottom: #0c131d;

      --shell-top: rgba(20,29,43,0.96);
      --shell-bottom: rgba(20,29,43,0.96);
      --shell-border: rgba(148,163,184,0.16);
      --shell-shadow: 0 10px 28px rgba(0,0,0,0.34);

      --hero-top: rgba(255,255,255,0.03);
      --hero-bottom: rgba(255,255,255,0.03);

      --card: rgba(23,34,49,0.98);
      --card-strong: rgba(23,34,49,0.98);
      --text: #e6edf7;
      --muted: #9aa9bc;
      --border: rgba(148,163,184,0.16);
      --shadow: 0 6px 20px rgba(0,0,0,0.28);
      --accent: #8db7e1;
      --accent-2: #8db7e1;

      --logo-bg: rgba(255,255,255,0.02);
      --logo-shadow: 0 6px 20px rgba(0,0,0,0.24);

      --tool-border: rgba(148,163,184,0.18);
      --tool-active-top: rgba(30,42,58,1);
      --tool-active-bottom: rgba(30,42,58,1);
      --tool-active-shadow: 0 4px 12px rgba(0,0,0,0.24);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, var(--bg-top-glow), transparent 38%),
        linear-gradient(180deg, var(--bg-grad-top) 0%, var(--bg-grad-bottom) 100%);
      transition: background 0.35s ease, color 0.35s ease;
    }

    body { display: flex; justify-content: center; }

    .app {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      padding: calc(14px + var(--safe-top)) 14px calc(24px + var(--safe-bottom));
    }

    .shell {
      background: linear-gradient(180deg, var(--shell-top), var(--shell-bottom));
      border: 1px solid var(--shell-border);
      border-radius: 20px;
      box-shadow: var(--shell-shadow);
      overflow: hidden;
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .hero {
      padding: 16px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--hero-top), var(--hero-bottom));
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .logo-wrap { width: 100%; display: flex; justify-content: center; align-items: center; }
    .logo-wrap a { display: block; width: 100%; }

    .logo {
      width: 100%;
      max-width: 100%;
      display: block;
      border-radius: 14px;
      object-fit: contain;
      background: var(--logo-bg);
      box-shadow: var(--logo-shadow);
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }

    .section { padding: 12px 14px 18px; }

    .tool-list { display: grid; gap: 12px; }

    .tool-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 18px;
      border: 1px solid var(--tool-border);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, var(--card-strong), var(--card));
      color: var(--text);
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.35s ease, color 0.35s ease;
    }

    .tool-button:active {
      transform: scale(0.985);
      box-shadow: var(--tool-active-shadow);
      background: linear-gradient(180deg, var(--tool-active-top), var(--tool-active-bottom));
    }

    .tool-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: white;
      flex: 0 0 auto;
      transition: background 0.35s ease;
    }

    .tool-title { display: block; font-size: 1.02rem; font-weight: 750; line-height: 1.2; color: var(--text); }
    .chevron { color: var(--accent); flex: 0 0 auto; opacity: 0.9; transition: color 0.35s ease; }

    @media (min-width: 520px) {
      .app { padding-left: 18px; padding-right: 18px; }
      .hero { padding: 18px 18px 10px; }
      .section { padding: 14px 18px 22px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <section class="hero">
        <div class="logo-wrap">
          <a href="index.html" aria-label="Go to home page"><img id="main-logo" src="logo.png" alt="Himmelblå logo" class="logo"></a>
        </div>
      </section>

      <section class="section">
        <div id="tool-list" class="tool-list"></div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      const tools = [
        {
          title: "Contacts",
          href: "contacts.html",
          ariaLabel: "Open Contacts",
          icon: `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M6.5 4.5H17.5C18.3284 4.5 19 5.17157 19 6V18C19 18.8284 18.3284 19.5 17.5 19.5H6.5C5.67157 19.5 5 18.8284 5 18V6C5 5.17157 5.67157 4.5 6.5 4.5Z" stroke="currentColor" stroke-width="2"/>
              <path d="M9 10C9 8.89543 9.89543 8 11 8H13C14.1046 8 15 8.89543 15 10C15 11.1046 14.1046 12 13 12H11C9.89543 12 9 11.1046 9 10Z" stroke="currentColor" stroke-width="2"/>
              <path d="M8 16C8.8 14.8 10.2 14 12 14C13.8 14 15.2 14.8 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          `
        },
        {
          title: "Guides",
          href: "guides.html",
          ariaLabel: "Open Guides",
          icon: `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M6.5 5.5C6.5 4.94772 6.94772 4.5 7.5 4.5H15.5C16.0523 4.5 16.5 4.94772 16.5 5.5V19.5L13 17.7L9.5 19.5V5.5C9.5 4.94772 9.05228 4.5 8.5 4.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M8 7.5H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 10.5H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 13.5H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          `
        },
        {
          title: "Navigate To",
          href: "navigate.html",
          ariaLabel: "Open Navigate To",
          icon: `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 20C12 20 18 14.3 18 10.2C18 6.78 15.31 4 12 4C8.69 4 6 6.78 6 10.2C6 14.3 12 20 12 20Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M12 12.7C13.38 12.7 14.5 11.58 14.5 10.2C14.5 8.82 13.38 7.7 12 7.7C10.62 7.7 9.5 8.82 9.5 10.2C9.5 11.58 10.62 12.7 12 12.7Z" stroke="currentColor" stroke-width="2"/>
            </svg>
          `
        },
        {
          title: "Rig-down checklist",
          href: "rigdown.html",
          ariaLabel: "Rig-down checklist",
          icon: `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M9 12.5L11.2 14.7L15.5 9.8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 4.5H17C18.1046 4.5 19 5.39543 19 6.5V19.5L16 17.2L13 19.5L10 17.2L7 19.5V6.5C7 5.39543 7.89543 4.5 9 4.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          `
        },
        {
          title: "Settings",
          href: "settings.html",
          ariaLabel: "Open Settings",
          icon: `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 15.2C13.7673 15.2 15.2 13.7673 15.2 12C15.2 10.2327 13.7673 8.8 12 8.8C10.2327 8.8 8.8 10.2327 8.8 12C8.8 13.7673 10.2327 15.2 12 15.2Z" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 13.1L20.4 12L19.4 10.9L17.9 10.7C17.8 10.3 17.6 9.9 17.4 9.5L18.3 8.2L17.5 6.8L16 7.1C15.7 6.8 15.3 6.6 14.9 6.4L14.7 4.9H13.3L13.1 6.4C12.7 6.5 12.3 6.7 11.9 6.9L10.6 6L9.2 6.8L9.5 8.3C9.2 8.6 9 9 8.8 9.4L7.3 9.6V11L8.8 11.2C8.9 11.6 9.1 12 9.3 12.4L8.4 13.7L9.2 15.1L10.7 14.8C11 15.1 11.4 15.3 11.8 15.5L12 17H13.4L13.6 15.5C14 15.4 14.4 15.2 14.8 15L16.1 15.9L17.5 15.1L17.2 13.6C17.5 13.3 17.7 12.9 17.9 12.5L19.4 13.1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          `
        },
        {
          title: "Technical Reference",
          href: "specs.html",
          ariaLabel: "Open Specs",
          icon: `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M8 4.5H13.5L17 8V18.5C17 19.0523 16.5523 19.5 16 19.5H8C7.44772 19.5 7 19.0523 7 18.5V5.5C7 4.94772 7.44772 4.5 8 4.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M13 4.5V8H16.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M9.5 11H14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M9.5 14H14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M9.5 17H12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          `
        }
      ];

      const toolList = document.getElementById("tool-list");

      function renderTools() {
        toolList.innerHTML = "";

        const sortedTools = [...tools].sort((a, b) =>
          a.title.localeCompare(b.title, undefined, { sensitivity: "base" })
        );

        sortedTools.forEach(tool => {
          const link = document.createElement("a");
          link.className = "tool-button";
          link.href = tool.href;
          link.setAttribute("aria-label", tool.ariaLabel || tool.title);

          link.innerHTML = `
            <div class="tool-left">
              <div class="tool-icon" aria-hidden="true">
                ${tool.icon}
              </div>
              <div class="tool-text">
                <span class="tool-title">${tool.title}</span>
              </div>
            </div>
            <svg class="chevron" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          `;

          toolList.appendChild(link);
        });
      }

      renderTools();
    })();
  </script>
  <script src="scripts/theme.js"></script>
  <script>
    initializeTheme();
  </script>
</body>
</html>
