<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå – Navigate To</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1722">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="logo.png">
  <link id="favicon-icon" rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles/common.css">

  <style>
    .cards {
      display: grid;
      gap: 14px;
    }

    .btn-map {
      appearance: none;
      border-radius: 12px;
      min-height: 52px;
      padding: 0 16px;
      width: 100%;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--accent);
      border: 1px solid var(--border);
      background: #ffffff;
      box-shadow: var(--shadow);
      transition: transform 0.06s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .btn-map:active {
      transform: scale(0.985);
    }

    html[data-theme="dark"] .btn-map {
      border-color: var(--border);
      background: #172231;
    }

    /* Unified dark-mode tokens across all pages */
    html[data-theme="dark"] {
      --bg: #0f1722;
      --card: #172231;
      --text: #e6edf7;
      --muted: #99a8bc;
      --accent: #8db7e1;
      --accent-2: #8db7e1;
      --border: rgba(148,163,184,0.16);
      --shadow: 0 6px 20px rgba(0,0,0,0.28);
      --bg-top: rgba(141, 183, 225, 0.16);
      --bg-grad-top: #0f1722;
      --bg-grad-bottom: #0c131d;
      --logo-wrap-bg: rgba(255,255,255,0.02);
      --logo-wrap-border: rgba(148,163,184,0.14);
      --back-bg: #172231;
      --back-border: rgba(148,163,184,0.16);
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="logo-wrap">
        <a href="index.html" aria-label="Go to home page"><img id="main-logo" src="logo.png" alt="Himmelblå logo" class="logo"></a>
      </div>
      <h1 class="page-title">Navigate To</h1>
      <p class="page-subtitle">Open destinations directly in Google Maps.</p>
    </header>

    <section class="cards">
      <a
        class="btn-map"
        href="https://maps.app.goo.gl/xkxXKJmaVfxgRC2Y7"
        target="_blank"
        rel="noopener noreferrer"
      >
        Himmelblå
      </a>
      <a
        class="btn-map"
        href="https://maps.app.goo.gl/gVxNmkVdDLs93uTh6"
        target="_blank"
        rel="noopener noreferrer"
      >
        Bytteplassen Singsås
      </a>
    </section>

    <div class="back-row">
      <a class="back-link" href="index.html">Back</a>
    </div>
  </main>

  <script src="scripts/theme.js"></script>
  <script>
    initializeTheme();
  </script>
</body>
</html>
