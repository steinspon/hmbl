<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå – Navigate To</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="logo.png">
  <link id="favicon-icon" rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles/common.css">

  <style>
    .cards {
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .card-title {
      margin: 0 0 10px;
      font-size: 1.25rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .btn-map {
      appearance: none;
      border-radius: 12px;
      min-height: 52px;
      padding: 0 16px;
      width: 100%;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--accent);
      border: 1px solid var(--border);
      background: #ffffff;
      box-shadow: var(--shadow);
      transition: transform 0.06s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .btn-map:active {
      transform: scale(0.985);
    }

    html[data-theme="dark"] .btn-map {
      border-color: var(--border);
      background: #172231;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="logo-wrap">
        <img id="main-logo" src="logo.png" alt="Himmelblå logo" class="logo">
      </div>
      <h1 class="page-title">Navigate To</h1>
      <p class="page-subtitle">Open destinations directly in Google Maps.</p>
    </header>

    <section class="cards">
      <article class="card">
        <h2 class="card-title">Destination</h2>
        <a
          class="btn-map"
          href="https://maps.app.goo.gl/gVxNmkVdDLs93uTh6"
          target="_blank"
          rel="noopener noreferrer"
        >
          Bytteplassen Singsås
        </a>
      </article>
    </section>

    <div class="back-row">
      <a class="back-link" href="index.html">Back</a>
    </div>
  </main>

  <script src="scripts/theme.js"></script>
  <script>
    initializeTheme();
  </script>
</body>
</html>
