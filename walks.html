<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå – Walks</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1722">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="icon-180.png">
  <link id="favicon-icon" rel="icon" href="favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles/common.css">

  <style>
    .cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

    .card {
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card-link { display: block; text-decoration: none; color: inherit; cursor: pointer; }
    .card-link:hover {
      border-color: var(--card-hover-border);
      box-shadow: var(--card-hover-shadow);
      transform: translateY(-1px);
    }
    .card-link:active { transform: scale(0.995); }

    .card-title {
      margin: 0 0 8px;
      font-size: 1.25rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .card-desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .card-desc a { color: var(--map-link); font-weight: 600; text-decoration: none; }

    .image-gallery {
      display: flex;
      min-width: 0;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scroll-snap-type: x proximity;
    }

    .image-gallery::-webkit-scrollbar { display: none; }

    .card-image {
      flex: 0 0 auto;
      height: 200px;
      width: auto;
      display: block;
      border-radius: 14px;
      box-shadow: var(--image-shadow);
      scroll-snap-align: start;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
    }

    .trip-links { display: flex; flex-wrap: wrap; gap: 10px; }

    .trip-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      background: var(--accent);
      color: white;
      box-shadow: var(--manual-shadow);
      transition: transform 0.06s ease, box-shadow 0.15s ease, opacity 0.15s ease, background 0.3s ease;
    }

    .trip-link:active { transform: scale(0.985); }

    .empty-note {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }

    @media (min-width: 700px) {
      .cards { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    }
  </style>
</head>
<body data-activity-category="walks">
  <main class="app">
    <header class="header">
      <div class="logo-wrap">
        <a href="index.html" aria-label="Go to home page"><img id="main-logo" src="logo_winter_daytime.webp" alt="Himmelblå logo" class="logo"></a>
      </div>
      <h1 class="page-title">Walks</h1>
      <p class="page-subtitle">Walking and hiking routes around the cabin.</p>
    </header>

    <section id="cards" class="cards"></section>

    <div class="back-row">
      <a class="back-link" href="things-to-do.html">Back</a>
    </div>
  </main>

  <script src="scripts/site-data.js"></script>
  <script src="scripts/trip-list.js"></script>
  <script src="scripts/theme.js"></script>
  <script src="scripts/search-target.js"></script>
  <script>
    initializeTheme();
  </script>
</body>
</html>
