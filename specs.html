<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå – Specifications & User Manuals</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1722">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="logo_winter_daytime.png">
  <link id="favicon-icon" rel="icon" href="logo_winter_daytime.png">
  <link rel="stylesheet" href="styles/common.css">

  <style>
    :root {
      --bg: #eef3f7;
      --card: rgba(255, 255, 255, 0.9);
      --text: #18324a;
      --muted: #58718a;
      --accent: #2c5f87;
      --accent-2: #6fa8dc;
      --border: rgba(44, 95, 135, 0.12);
      --shadow: 0 10px 30px rgba(24, 50, 74, 0.10);
      --radius: 20px;

      --bg-top: rgba(111, 168, 220, 0.18);
      --bg-grad-top: #f7fbff;
      --bg-grad-bottom: var(--bg);

      --logo-wrap-bg: rgba(255,255,255,0.65);
      --logo-wrap-border: rgba(255,255,255,0.65);

      --back-bg: rgba(255,255,255,0.8);
      --back-border: rgba(44, 95, 135, 0.14);

      --manual-bg-top: #2f6f9f;
      --manual-bg-bottom: #25577d;
      --manual-shadow: 0 6px 16px rgba(44, 95, 135, 0.14);

      --image-shadow: 0 6px 18px rgba(24, 50, 74, 0.10);
      --map-link: #2c5f87;
    }

    html[data-theme="dark"] {
      --bg: #0a1220;
      --card: rgba(20, 31, 48, 0.9);
      --text: #e7eef8;
      --muted: #9fb0c7;
      --accent: #6de3b0;
      --accent-2: #4eb7ff;
      --border: rgba(170, 190, 220, 0.10);
      --shadow: 0 10px 30px rgba(0,0,0,0.28);

      --bg-top: rgba(80, 220, 170, 0.14);
      --bg-grad-top: #0f1b2b;
      --bg-grad-bottom: #09111d;

      --logo-wrap-bg: rgba(255,255,255,0.04);
      --logo-wrap-border: rgba(255,255,255,0.06);

      --back-bg: rgba(255,255,255,0.04);
      --back-border: rgba(109, 227, 176, 0.15);

      --manual-bg-top: #26415b;
      --manual-bg-bottom: #1b2f44;
      --manual-shadow: 0 6px 16px rgba(0,0,0,0.24);

      --image-shadow: 0 6px 18px rgba(0,0,0,0.22);
      --map-link: #6de3b0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at top, var(--bg-top), transparent 35%),
        linear-gradient(180deg, var(--bg-grad-top) 0%, var(--bg-grad-bottom) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100%;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body {
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 14px 28px;
    }

    .header {
      margin-bottom: 18px;
    }

    .logo-wrap {
      background: var(--logo-wrap-bg);
      border: 1px solid var(--logo-wrap-border);
      border-radius: 24px;
      padding: 10px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }

    .page-title {
      margin: 18px 4px 6px;
      font-size: 1.75rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .page-subtitle {
      margin: 0 10px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.35;
    }

    .page-subtitle a {
      color: var(--map-link);
      font-weight: 600;
      text-decoration: none;
    }

    .cards {
      display: grid;
      gap: 14px;
    }

    .search-wrap {
      margin: 0 0 14px;
      display: grid;
      gap: 10px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .search-input {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      font-size: 0.98rem;
      color: var(--text);
      background: var(--card);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-btn {
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .search-status {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .search-active-hit {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 8px;
      transition: outline-color 0.2s ease;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card-title {
      margin: 0 0 8px;
      font-size: 1.25rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .card-desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .image-gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scroll-snap-type: x proximity;
    }

    .image-gallery::-webkit-scrollbar {
      display: none;
    }

    .card-image {
      flex: 0 0 auto;
      width: 80%;
      max-width: 280px;
      display: block;
      border-radius: 14px;
      box-shadow: var(--image-shadow);
      scroll-snap-align: start;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
    }

    .manual-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .manual-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      background: var(--accent);
      color: white;
      box-shadow: var(--manual-shadow);
      transition: transform 0.06s ease, box-shadow 0.15s ease, opacity 0.15s ease, background 0.3s ease;
    }

    .manual-link:active {
      transform: scale(0.985);
    }

    .back-row {
      margin-top: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      background: var(--back-bg);
      color: var(--accent);
      border: 1px solid var(--back-border);
      box-shadow: var(--shadow);
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .empty-note {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      color: var(--muted);
      text-align: center;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Unified dark-mode tokens across all pages */
    html[data-theme="dark"] {
      --bg: #0f1722;
      --card: #172231;
      --text: #e6edf7;
      --muted: #99a8bc;
      --accent: #8db7e1;
      --accent-2: #8db7e1;
      --border: rgba(148,163,184,0.16);
      --shadow: 0 6px 20px rgba(0,0,0,0.28);
      --bg-top: rgba(141, 183, 225, 0.16);
      --bg-grad-top: #0f1722;
      --bg-grad-bottom: #0c131d;
      --logo-wrap-bg: rgba(255,255,255,0.02);
      --logo-wrap-border: rgba(148,163,184,0.14);
      --back-bg: #172231;
      --back-border: rgba(148,163,184,0.16);
      --manual-bg-top: #8db7e1;
      --manual-bg-bottom: #8db7e1;
      --manual-shadow: 0 6px 16px rgba(0,0,0,0.24);
      --image-shadow: 0 6px 18px rgba(0,0,0,0.24);
      --map-link: #8db7e1;
    }

    @media (min-width: 700px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo-wrap">
        <a href="index.html" aria-label="Go to home page"><img id="main-logo" src="logo_winter_daytime.png" alt="Himmelblå logo" class="logo"></a>
      </div>
      <h1 class="page-title">Technical Reference</h1>
      <p class="page-subtitle">
        Gårdsnummer.: 107 
        <br>Bruksnummer: 71
        <br>Måssårabben 3
        <br>2550 Os i Østerdalen
        <br>-
        <br><a href="https://ut.no/kart#17/62.47479/11.224522" target="_blank" rel="noopener noreferrer">Open map (UT.no)</a>
        <br>-
        <br>Internal Area (BRA/P-ROM): 72/66 m2
        <br>Roof Area: 110 m2
        <br>Plot: 1871 m2
        <br>Byggeår: 2002
        <br>807 moh.
      </p>
    </header>

    <section class="search-wrap" aria-label="Search technical reference">
      <div class="search-row">
        <input id="search-input" class="search-input" type="search" placeholder="Search technical reference">
        <button id="search-btn" class="search-btn" type="button">Search</button>
      </div>
      <p id="search-status" class="search-status"></p>
    </section>

    <section id="cards" class="cards"></section>

    <div class="back-row">
      <a class="back-link" href="index.html">Back</a>
    </div>
  </main>

  <script src="scripts/site-data.js"></script>
  <script>
    const entries = window.SITE_DATA.specs;

    const cardsEl = document.getElementById("cards");
    const searchInput = document.getElementById("search-input");
    const searchBtn = document.getElementById("search-btn");
    const searchStatus = document.getElementById("search-status");

    let matches = [];
    let currentMatchIndex = -1;
    let lastQuery = "";

    function renderCards() {
      cardsEl.innerHTML = "";

      const sortedEntries = [...entries].sort((a, b) =>
        a.title.localeCompare(b.title, undefined, { sensitivity: "base" })
      );

      if (!sortedEntries.length) {
        cardsEl.innerHTML = '<div class="empty-note">No specifications or manuals added yet.</div>';
        return;
      }

      sortedEntries.forEach(entry => {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.className = "card-title";
        title.textContent = entry.title;
        card.appendChild(title);

        const desc = document.createElement("p");
        desc.className = "card-desc";
        const descriptionLines = entry.descriptionLines || (entry.description ? [entry.description] : []);
        const descriptionLinks = entry.descriptionLinks || [];

        if (descriptionLines.length) {
          descriptionLines.forEach((line, index) => {
            if (index > 0) {
              desc.appendChild(document.createElement("br"));
            }
            desc.appendChild(document.createTextNode(line));
          });
        }

        if (descriptionLinks.length) {
          descriptionLinks.forEach((linkItem) => {
            desc.appendChild(document.createElement("br"));
            const link = document.createElement("a");
            link.href = linkItem.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = linkItem.label;
            link.style.color = "var(--map-link)";
            link.style.fontWeight = "600";
            link.style.textDecoration = "none";
            desc.appendChild(link);
          });
        }

        card.appendChild(desc);

        if (entry.images && entry.images.length) {
          const gallery = document.createElement("div");
          gallery.className = "image-gallery";

          entry.images.forEach(src => {
            const img = document.createElement("img");
            img.className = "card-image";
            img.src = src;
            img.alt = entry.title;
            img.addEventListener("click", () => {
              window.open(src, "_blank");
            });
            gallery.appendChild(img);
          });

          card.appendChild(gallery);
        }

        if (entry.manuals && entry.manuals.length) {
          const linksWrap = document.createElement("div");
          linksWrap.className = "manual-links";

          entry.manuals.forEach(manual => {
            if (!manual.href) return;

            const link = document.createElement("a");
            link.className = "manual-link";
            link.href = manual.href;
            link.textContent = manual.label || "Manual";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            linksWrap.appendChild(link);
          });

          if (linksWrap.children.length) {
            card.appendChild(linksWrap);
          }
        }

        cardsEl.appendChild(card);
      });
    }

    function clearActiveHit() {
      document.querySelectorAll(".search-active-hit").forEach(el =>
        el.classList.remove("search-active-hit")
      );
    }

    function getSearchableElements() {
      return Array.from(document.querySelectorAll(
        ".page-subtitle, .card-title, .card-desc, .manual-link"
      ));
    }

    function computeMatches(query) {
      const q = query.trim().toLocaleLowerCase();
      if (!q) return [];

      return getSearchableElements().filter(el =>
        (el.textContent || "").toLocaleLowerCase().includes(q)
      );
    }

    function jumpToMatch(index) {
      clearActiveHit();
      const el = matches[index];
      if (!el) return;

      el.classList.add("search-active-hit");
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function runSearchCycle() {
      const query = searchInput.value || "";

      if (!query.trim()) {
        matches = [];
        currentMatchIndex = -1;
        lastQuery = "";
        clearActiveHit();
        searchStatus.textContent = "Enter a search term.";
        return;
      }

      if (query !== lastQuery || !matches.length) {
        matches = computeMatches(query);
        currentMatchIndex = -1;
        lastQuery = query;
      }

      if (!matches.length) {
        clearActiveHit();
        searchStatus.textContent = "No matches.";
        return;
      }

      currentMatchIndex = (currentMatchIndex + 1) % matches.length;
      jumpToMatch(currentMatchIndex);
      searchStatus.textContent = `${currentMatchIndex + 1} of ${matches.length}`;
    }

    renderCards();
    searchBtn.addEventListener("click", runSearchCycle);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        runSearchCycle();
      }
    });
    searchInput.addEventListener("input", () => {
      lastQuery = "";
      currentMatchIndex = -1;
      matches = [];
      clearActiveHit();
      searchStatus.textContent = "";
    });
  </script>
  <script src="scripts/theme.js"></script>
  <script src="scripts/search-target.js"></script>
  <script>
    initializeTheme();
  </script>
</body>
</html>
