<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå – Guide</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1722">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="icon-180.png">
  <link id="favicon-icon" rel="icon" href="favicon-32.png">
  <link rel="stylesheet" href="styles/common.css">

  <style>
    .page-description {
      margin: 0 10px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .guide-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .step {
      margin-bottom: 24px;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .step-number {
      margin: 0 0 8px;
      font-size: 1.05rem;
      line-height: 1.2;
      font-weight: 800;
      color: var(--text);
    }

    .step-text {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .step-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .step-image.bottom {
      margin: 12px 0 0;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo-wrap">
        <a href="index.html" aria-label="Go to home page"><img id="main-logo" src="logo_winter_daytime.webp" alt="Himmelblå logo" class="logo"></a>
      </div>
      <h1 id="page-title" class="page-title">Guide</h1>
      <p id="page-description" class="page-description"></p>
    </header>

    <section id="guide-card" class="guide-card"></section>

    <div class="back-row">
      <a class="back-link" href="guides.html">Back</a>
    </div>
  </main>

  <script src="scripts/site-data.js"></script>
  <script>
    const guides = Object.fromEntries(window.SITE_DATA.guides.map(g => [g.id, g]));

    function renderGuide() {
      const params = new URLSearchParams(window.location.search);
      const guideId = params.get("id");
      const guide = guides[guideId] || guides["sauna-shutoff"];

      document.title = `Himmelblå – ${guide.title}`;
      document.getElementById("page-title").textContent = guide.title;
      document.getElementById("page-description").textContent = guide.description;

      const guideCard = document.getElementById("guide-card");
      guideCard.innerHTML = "";

      guide.steps.forEach((step) => {
        const stepEl = document.createElement("div");
        stepEl.className = "step";

        const titleEl = document.createElement("p");
        titleEl.className = "step-number";
        titleEl.textContent = step.title;
        stepEl.appendChild(titleEl);

        if (step.imageTop) {
          const imgTop = document.createElement("img");
          imgTop.className = "step-image";
          imgTop.loading = "lazy";
          imgTop.decoding = "async";
          imgTop.src = step.imageTop;
          imgTop.alt = step.imageTopAlt || "";
          stepEl.appendChild(imgTop);
        }

        const textEl = document.createElement("p");
        textEl.className = "step-text";
        textEl.textContent = step.text;
        stepEl.appendChild(textEl);

        if (step.imageBottom) {
          const imgBottom = document.createElement("img");
          imgBottom.className = "step-image bottom";
          imgBottom.loading = "lazy";
          imgBottom.decoding = "async";
          imgBottom.src = step.imageBottom;
          imgBottom.alt = step.imageBottomAlt || "";
          stepEl.appendChild(imgBottom);
        }

        guideCard.appendChild(stepEl);
      });
    }

    renderGuide();
  </script>
  <script src="scripts/theme.js"></script>
  <script src="scripts/search-target.js"></script>
  <script>
    initializeTheme();
  </script>
</body>
</html>
