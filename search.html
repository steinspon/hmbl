<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå – Search</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1722">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="icon-180.png">
  <link id="favicon-icon" rel="icon" href="favicon-32.png">
  <link rel="stylesheet" href="styles/common.css">

  <style>
    .search-wrap { display: grid; gap: 10px; }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .search-input {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      font-size: 0.98rem;
      color: var(--text);
      background: var(--card);
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-btn {
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .search-status { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .results { margin-top: 12px; display: grid; gap: 10px; }
    .result-link {
      display: block;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 14px;
      color: inherit;
    }
    .result-page { margin: 0 0 6px; font-size: 0.86rem; color: var(--accent); font-weight: 700; }
    .result-title { margin: 0 0 6px; font-size: 1rem; color: var(--text); font-weight: 700; }
    .result-meta { margin: 0 0 6px; font-size: 0.85rem; color: var(--muted); }
    .result-snippet { margin: 0; color: var(--text); line-height: 1.4; font-size: 0.95rem; }
    .result-snippet mark { background: rgba(141,183,225,0.35); color: inherit; padding: 0 1px; }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo-wrap">
        <a href="index.html" aria-label="Go to home page"><img id="main-logo" src="logo_winter_daytime.webp" alt="Himmelblå logo" class="logo"></a>
      </div>
      <h1 class="page-title">Search</h1>
    </header>

    <section class="search-wrap">
      <div class="search-row">
        <input id="search-input" class="search-input" type="search" placeholder="Search across pages">
        <button id="search-btn" class="search-btn" type="button">Search</button>
      </div>
      <p id="search-status" class="search-status"></p>
    </section>

    <section id="results" class="results"></section>

    <div class="back-row">
      <a class="back-link" href="index.html">Back</a>
    </div>
  </main>

  <script src="scripts/theme.js"></script>
  <script src="scripts/site-data.js"></script>
  <script>
    initializeTheme();

    // Build the search index from the single source of truth (SITE_DATA) at
    // runtime, so it can never drift out of sync with the pages.
    const searchIndex = buildSearchIndex(window.SITE_DATA || {});

    function specEntryText(entry) {
      const lines = entry.descriptionLines || (entry.description ? [entry.description] : []);
      const linkLabels = (entry.descriptionLinks || []).map(l => l.label);
      const manualLabels = (entry.manuals || []).map(m => m.label);
      return [...lines, ...linkLabels, ...manualLabels].join(" ");
    }

    function guideStepsText(guide) {
      return (guide.steps || [])
        .map(s => [s.text, s.imageTopAlt, s.imageBottomAlt].filter(Boolean).join(" "))
        .join(" ");
    }

    function checklistGuideText(item) {
      const blocks = (item.guide && item.guide.blocks) || [];
      return blocks.map(b => [b.text, b.alt].filter(Boolean).join(" ")).join(" ");
    }

    function buildSearchIndex(data) {
      const docs = [];

      (data.specs || []).forEach(entry => {
        docs.push({
          page: "specs.html",
          pageLabel: "Technical Reference",
          title: entry.title,
          content: specEntryText(entry)
        });
      });

      (data.guides || []).forEach(guide => {
        docs.push({
          page: `guide.html?id=${guide.id}`,
          pageLabel: "Guides",
          title: guide.title,
          content: [guide.summary, guide.description, guideStepsText(guide)]
            .filter(Boolean).join(" ")
        });
      });

      (data.checklist || []).forEach(section => {
        (section.items || []).forEach(item => {
          docs.push({
            page: "rigdown.html",
            pageLabel: "Rig-down checklist",
            title: item.label,
            content: [section.section, checklistGuideText(item)].filter(Boolean).join(" ")
          });
        });
      });

      (data.staticPages || []).forEach(p => {
        docs.push({
          page: p.page,
          pageLabel: p.pageLabel,
          title: p.title,
          content: p.content || ""
        });
      });

      return docs;
    }

    const searchInput = document.getElementById("search-input");
    const searchBtn = document.getElementById("search-btn");
    const searchStatus = document.getElementById("search-status");
    const resultsEl = document.getElementById("results");

    function normalizeForSearch(value) {
      return (value || "")
        .toLocaleLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function tokenizeQuery(value) {
      const normalized = normalizeForSearch(value);
      return (normalized.match(/[\p{L}\p{N}]+/gu) || []).filter(Boolean);
    }

    function getWordTokensWithIndex(value) {
      const normalized = normalizeForSearch(value);
      const out = [];
      for (const m of normalized.matchAll(/[\p{L}\p{N}]+/gu)) {
        out.push({ token: m[0], index: m.index || 0 });
      }
      return out;
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // Match a single query token against a field's words.
    // Returns the best match kind (exact > prefix > substring) and the index
    // of the matched word, or null when there is no match. Substring matching
    // means partial queries like "dish" find "dishwasher".
    function matchToken(words, token) {
      let best = null;
      for (const w of words) {
        let kind = null;
        if (w.token === token) kind = "exact";
        else if (w.token.startsWith(token)) kind = "prefix";
        else if (w.token.includes(token)) kind = "substring";
        if (!kind) continue;
        const rank = kind === "exact" ? 3 : kind === "prefix" ? 2 : 1;
        if (!best || rank > best.rank) {
          best = { kind, rank, index: w.index, word: w.token };
          if (kind === "exact") break;
        }
      }
      return best;
    }

    const FIELD_WEIGHT = { title: 12, pageLabel: 5, content: 3 };
    const KIND_WEIGHT = { exact: 3, prefix: 2, substring: 1 };

    function makeSnippet(text, idx, matchLength) {
      const start = Math.max(0, idx - 60);
      const end = Math.min(text.length, idx + matchLength + 60);
      const prefix = start > 0 ? "\u2026" : "";
      const suffix = end < text.length ? "\u2026" : "";
      return `${prefix}${text.slice(start, end).trim()}${suffix}`;
    }

    function makeBestContentSnippet(content, words, token) {
      const text = (content || "").trim();
      if (!text) return "";
      const match = token ? matchToken(words, token) : null;
      if (!match) return text.length > 140 ? `${text.slice(0, 140).trim()}\u2026` : text;
      return makeSnippet(text, match.index, match.word.length);
    }

    function highlightTokens(snippet, tokens) {
      let html = escapeHtml(snippet);
      // Highlight each query token (and longer words containing it) once.
      const sorted = [...new Set(tokens)].sort((a, b) => b.length - a.length);
      sorted.forEach(t => {
        const safe = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        html = html.replace(new RegExp(`(${safe}[\\p{L}\\p{N}]*)`, "giu"), "<mark>$1</mark>");
      });
      // Avoid nested <mark> from overlapping passes.
      return html.replace(/<mark>(<mark>)+/g, "<mark>").replace(/(<\/mark>)+<\/mark>/g, "</mark>");
    }

    function scoreDocument(item, tokens) {
      const titleWords = getWordTokensWithIndex(item.title || "");
      const pageLabelWords = getWordTokensWithIndex(item.pageLabel || "");
      const contentWords = getWordTokensWithIndex(item.content || "");

      let matchedCount = 0;
      let score = 0;
      let jumpToken = "";
      let jumpRank = -1;
      let matchedInContent = false;
      let matchedInTitle = false;

      tokens.forEach(t => {
        const inTitle = matchToken(titleWords, t);
        const inLabel = matchToken(pageLabelWords, t);
        const inContent = matchToken(contentWords, t);
        if (!inTitle && !inLabel && !inContent) return;

        matchedCount += 1;
        if (inTitle) score += FIELD_WEIGHT.title * KIND_WEIGHT[inTitle.kind];
        if (inLabel) score += FIELD_WEIGHT.pageLabel * KIND_WEIGHT[inLabel.kind];
        if (inContent) score += FIELD_WEIGHT.content * KIND_WEIGHT[inContent.kind];
        if (inTitle) matchedInTitle = true;
        if (inContent) matchedInContent = true;

        // Pick the strongest, longest matched token to drive the on-page jump.
        const best = inContent || inTitle || inLabel;
        const rank = best.rank * 100 + t.length;
        if (rank > jumpRank) {
          jumpRank = rank;
          jumpToken = t;
        }
      });

      if (!matchedCount) return null;

      const matchSource = matchedInTitle ? "Entry title"
        : matchedInContent ? "Page content"
        : "Page heading";

      return {
        ...item,
        score,
        matchedCount,
        matchedAll: matchedCount === tokens.length,
        jumpToken,
        matchSource,
        snippet: makeBestContentSnippet(item.content || item.title || "", contentWords, jumpToken)
      };
    }

    function runSearch() {
      const query = (searchInput.value || "").trim();
      const tokens = tokenizeQuery(query);
      if (!tokens.length) {
        resultsEl.innerHTML = "";
        searchStatus.textContent = "Enter a search term.";
        return;
      }

      const scored = [];
      searchIndex.forEach(item => {
        const hit = scoreDocument(item, tokens);
        if (hit) scored.push(hit);
      });

      // Prefer documents matching every query token; fall back to partial.
      const full = scored.filter(h => h.matchedAll);
      const pool = full.length ? full : scored;

      const pageHitCount = {};
      const hits = pool
        .sort((a, b) =>
          b.matchedCount - a.matchedCount ||
          b.score - a.score ||
          (a.title || "").localeCompare(b.title || "")
        )
        .slice(0, 120)
        .map(hit => {
          const pageKey = hit.page || "";
          const idx = pageHitCount[pageKey] || 0;
          pageHitCount[pageKey] = idx + 1;
          return { ...hit, hit: idx };
        });

      resultsEl.innerHTML = "";

      if (!hits.length) {
        searchStatus.textContent = "No matches.";
        return;
      }

      searchStatus.textContent = `${hits.length} result${hits.length === 1 ? "" : "s"}.`;

      hits.forEach((hit) => {
        const link = document.createElement("a");
        link.className = "result-link";
        const sep = hit.page.includes("?") ? "&" : "?";
        link.href = `${hit.page}${sep}q=${encodeURIComponent(query)}&target=${encodeURIComponent(hit.jumpToken || query)}&hit=${hit.hit || 0}`;

        link.innerHTML = `
          <p class="result-page">${escapeHtml(hit.pageLabel)}</p>
          <p class="result-title">${escapeHtml(hit.title)}</p>
          <p class="result-meta">Matched in: ${escapeHtml(hit.matchSource)}</p>
          <p class="result-snippet">${highlightTokens(hit.snippet, tokens)}</p>
        `;

        resultsEl.appendChild(link);
      });
    }

    let searchDebounce = null;
    function runSearchDebounced() {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(runSearch, 150);
    }

    searchBtn.addEventListener("click", runSearch);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        clearTimeout(searchDebounce);
        runSearch();
      }
    });
    searchInput.addEventListener("input", runSearchDebounced);
  </script>
</body>
</html>
