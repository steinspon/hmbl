<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Himmelblå - Search</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1722">
  <meta name="apple-mobile-web-app-title" content="Himmelblå">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="logo_winter_daytime.png">
  <link id="favicon-icon" rel="icon" href="logo_winter_daytime.png">
  <link rel="stylesheet" href="styles/common.css">

  <style>
    .search-wrap { display: grid; gap: 10px; }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .search-input {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      font-size: 0.98rem;
      color: var(--text);
      background: var(--card);
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-btn {
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .search-status { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .results { margin-top: 12px; display: grid; gap: 10px; }
    .result-link {
      display: block;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 14px;
      color: inherit;
    }
    .result-page { margin: 0 0 6px; font-size: 0.86rem; color: var(--accent); font-weight: 700; }
    .result-title { margin: 0 0 6px; font-size: 1rem; color: var(--text); font-weight: 700; }
    .result-meta { margin: 0 0 6px; font-size: 0.85rem; color: var(--muted); }
    .result-snippet { margin: 0; color: var(--text); line-height: 1.4; font-size: 0.95rem; }
    .result-snippet mark { background: rgba(141,183,225,0.35); color: inherit; padding: 0 1px; }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo-wrap">
        <a href="index.html" aria-label="Go to home page"><img id="main-logo" src="logo_winter_daytime.png" alt="Himmelblå logo" class="logo"></a>
      </div>
      <h1 class="page-title">Search</h1>
    </header>

    <section class="search-wrap">
      <div class="search-row">
        <input id="search-input" class="search-input" type="search" placeholder="Search across pages">
        <button id="search-btn" class="search-btn" type="button">Search</button>
      </div>
      <p id="search-status" class="search-status"></p>
    </section>

    <section id="results" class="results"></section>

    <div class="back-row">
      <a class="back-link" href="index.html">Back</a>
    </div>
  </main>

  <script src="scripts/theme.js"></script>
  <script src="scripts/search-index.js"></script>
  <script>
    initializeTheme();
    const searchIndex = Array.isArray(window.SEARCH_INDEX) ? window.SEARCH_INDEX : [];

    const searchInput = document.getElementById("search-input");
    const searchBtn = document.getElementById("search-btn");
    const searchStatus = document.getElementById("search-status");
    const resultsEl = document.getElementById("results");

    function normalizeForSearch(value) {
      return (value || "")
        .toLocaleLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function tokenizeQuery(value) {
      const normalized = normalizeForSearch(value);
      const matches = normalized.match(/[\p{L}\p{N}]+/gu) || [];
      return matches.filter(Boolean);
    }

    function getWordTokensWithIndex(value) {
      const normalized = normalizeForSearch(value);
      const matches = normalized.matchAll(/[\p{L}\p{N}]+/gu);
      const out = [];
      for (const m of matches) {
        out.push({ token: m[0], index: m.index || 0 });
      }
      return out;
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function highlight(snippet, query) {
      const esc = escapeHtml(snippet);
      const q = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return esc.replace(new RegExp(q, "ig"), (m) => `<mark>${m}</mark>`);
    }

    function makeSnippet(text, idx, queryLength) {
      const start = Math.max(0, idx - 60);
      const end = Math.min(text.length, idx + queryLength + 60);
      const prefix = start > 0 ? "..." : "";
      const suffix = end < text.length ? "..." : "";
      return `${prefix}${text.slice(start, end).trim()}${suffix}`;
    }

    function makeBestContentSnippet(content, token) {
      const text = (content || "").trim();
      if (!text) return "";
      const normalizedText = normalizeForSearch(text);
      const normalizedToken = normalizeForSearch(token || "");
      const idx = normalizedToken ? normalizedText.indexOf(normalizedToken) : -1;
      if (idx < 0) return text.length > 140 ? `${text.slice(0, 140)}...` : text;
      return makeSnippet(text, idx, normalizedToken.length || 1);
    }

    function runSearch() {
      const query = (searchInput.value || "").trim();
      if (!query) {
        resultsEl.innerHTML = "";
        searchStatus.textContent = "Enter a search term.";
        return;
      }

      const tokens = tokenizeQuery(query);
      if (!tokens.length) {
        resultsEl.innerHTML = "";
        searchStatus.textContent = "Enter a search term.";
        return;
      }

      const pageHitCount = {};
      const strictHits = [];
      const relaxedHits = [];

      searchIndex.forEach((item) => {
        const pageLabelText = item.pageLabel || "";
        const pagePathText = item.page || "";
        const fullText = `${item.title || ""} ${pageLabelText} ${item.content || ""}`.trim();
        if (!fullText) return;

        const words = getWordTokensWithIndex(fullText);
        if (!words.length) return;
        const titleWords = getWordTokensWithIndex(item.title || "");
        const pageLabelWords = getWordTokensWithIndex(pageLabelText);
        const pagePathWords = getWordTokensWithIndex(pagePathText.replace(/[^a-zA-Z0-9]+/g, " "));
        const contentWords = getWordTokensWithIndex(item.content || "");

        const firstIndexByToken = {};
        words.forEach(w => {
          if (firstIndexByToken[w.token] === undefined) firstIndexByToken[w.token] = w.index;
        });

        const matchedTokens = tokens.filter(t => firstIndexByToken[t] !== undefined);
        if (!matchedTokens.length) return;
        const titleTokenSet = new Set(titleWords.map(w => w.token));
        const pageLabelTokenSet = new Set(pageLabelWords.map(w => w.token));
        const pagePathTokenSet = new Set(pagePathWords.map(w => w.token));
        const contentTokenSet = new Set(contentWords.map(w => w.token));
        const titleMatchedTokenCount = matchedTokens.filter(t => titleTokenSet.has(t)).length;
        const pageLabelMatchedTokenCount = matchedTokens.filter(t => pageLabelTokenSet.has(t)).length;
        const pagePathMatchedTokenCount = matchedTokens.filter(t => pagePathTokenSet.has(t)).length;

        const contentMatchedTokens = matchedTokens.filter(t => contentTokenSet.has(t));
        const jumpToken = (contentMatchedTokens.length
          ? contentMatchedTokens
          : matchedTokens
        ).slice().sort((a, b) => b.length - a.length)[0];

        const matchSource = contentMatchedTokens.length ? "Checklist/Page content" :
          (titleMatchedTokenCount ? "Entry title" : "Page heading");

        const primaryToken = [...matchedTokens].sort((a, b) => {
          const ai = firstIndexByToken[a];
          const bi = firstIndexByToken[b];
          if (ai !== bi) return ai - bi;
          return b.length - a.length;
        })[0];
        const firstIdx = firstIndexByToken[primaryToken];

        const pageKey = item.page || "";
        const hitIndex = pageHitCount[pageKey] || 0;
        pageHitCount[pageKey] = hitIndex + 1;

        const entry = {
          ...item,
          score: firstIdx,
          hit: hitIndex,
          matchedTokenCount: matchedTokens.length,
          titleMatchedTokenCount,
          pageLabelMatchedTokenCount,
          pagePathMatchedTokenCount,
          jumpToken,
          matchSource,
          primaryToken,
          snippet: makeBestContentSnippet(item.content || fullText, jumpToken || primaryToken)
        };

        if (matchedTokens.length === tokens.length) {
          strictHits.push(entry);
        } else {
          relaxedHits.push(entry);
        }
      });

      const hits = (strictHits.length ? strictHits : relaxedHits)
        .sort((a, b) =>
          b.matchedTokenCount - a.matchedTokenCount ||
          b.pageLabelMatchedTokenCount - a.pageLabelMatchedTokenCount ||
          b.pagePathMatchedTokenCount - a.pagePathMatchedTokenCount ||
          b.titleMatchedTokenCount - a.titleMatchedTokenCount ||
          a.score - b.score ||
          (a.title || "").localeCompare(b.title || "")
        )
        .slice(0, 120);

      resultsEl.innerHTML = "";

      if (!hits.length) {
        searchStatus.textContent = "No matches.";
        return;
      }

      searchStatus.textContent = `${hits.length} result${hits.length === 1 ? "" : "s"}.`;

      hits.forEach((hit) => {
        const link = document.createElement("a");
        link.className = "result-link";
        link.href = `${hit.page}${hit.page.includes("?") ? "&" : "?"}q=${encodeURIComponent(query)}&target=${encodeURIComponent(hit.jumpToken || hit.primaryToken || query)}&hit=${hit.hit || 0}`;

        link.innerHTML = `
          <p class="result-page">${escapeHtml(hit.pageLabel)}</p>
          <p class="result-title">${escapeHtml(hit.title)}</p>
          <p class="result-meta">Matched in: ${escapeHtml(hit.matchSource)}${hit.jumpToken ? ` (${escapeHtml(hit.jumpToken)})` : ""}</p>
          <p class="result-snippet">${highlight(hit.snippet, query)}</p>
        `;

        resultsEl.appendChild(link);
      });
    }

    searchBtn.addEventListener("click", runSearch);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        runSearch();
      }
    });
  </script>
</body>
</html>
